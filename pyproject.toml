[project]
name = "psilib"
version = "0.1.0"
description = "Biblioteca psicanalítica (Freud, Lacan e escolas lacanianas) indexada para estudo de conceitos com IA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "httpx>=0.28",
    "lxml>=5.3",
    "pymupdf>=1.25",
    "lingua-language-detector>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[project.optional-dependencies]
lab = ["jupyterlab>=4.3", "pandas>=2.2", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.scripts]
psilib = "psilib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psilib"]

# Torch CPU-only: evita baixar CUDA (~2 GB) em servidores x86.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
