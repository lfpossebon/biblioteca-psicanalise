[project]
name = "psilib"
version = "0.1.0"
description = "Biblioteca psicanalítica (Freud, Lacan e escolas lacanianas) indexada para estudo de conceitos com IA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "httpx>=0.28",
    "lxml>=5.3",
    "pymupdf>=1.25",
    "lingua-language-detector>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "mcp>=1.9",
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[project.optional-dependencies]
lab = ["jupyterlab>=4.3", "pandas>=2.2", "matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[project.scripts]
psilib = "psilib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psilib"]

# Torch CPU-only: evita baixar CUDA (~2 GB) em servidores x86.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: precisa do Postgres (usa o banco descartável psilib_test)"]

[tool.coverage.run]
source = ["psilib"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Regras da disciplina de Deploy: pyflakes, isort, pyupgrade, pylint e proibição de print (T201)
select = ["E", "F", "I", "UP", "B", "PL", "T20"]
ignore = [
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # limites de complexidade: o CLI e o pipeline têm muitas opções
    "E501",                                      # comprimento de linha fica a cargo do `ruff format`
    "PLR2004",                                   # números literais são comuns em parsing de texto
    "PLC0415",                                   # imports tardios são intencionais (torch/sentence-transformers são pesados)
]

[tool.ruff.lint.per-file-ignores]
"src/psilib/cli.py" = ["B008"]                 # typer.Option em defaults é o padrão do Typer
"scripts/*.py" = ["T201"]                      # scripts de fumaça imprimem no terminal
