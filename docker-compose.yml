name: psilib

# Credenciais do banco vêm do .env (fator 3 dos 12 fatores). Os padrões abaixo valem só para uso
# local: as portas ficam presas a 127.0.0.1. Atenção: o Postgres só aplica usuário/senha na criação
# do volume pgdata; trocar depois exige ALTER USER no banco.
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-psi}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psi}
  POSTGRES_DB: ${POSTGRES_DB:-psilib}

x-app: &app
  build:
    context: .
    target: base
  image: psilib:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-psi}:${POSTGRES_PASSWORD:-psi}@db:5432/${POSTGRES_DB:-psilib}
    CORPUS_DIR: /corpus
    DATA_DIR: /data
    CATALOG_DIR: /app/catalog
  # Montar em vez de embutir (Deck 04): dados e configuração ficam fora da imagem.
  # O código (src/) NÃO é montado aqui — a imagem é autocontida. Em desenvolvimento,
  # docker-compose.override.yml monta src/ ao vivo (carregado automaticamente pelo compose).
  volumes:
    - ${CORPUS_DIR_HOST:-..}:/corpus:ro      # acervo local, somente leitura
    - ./data:/data                            # raw baixado (Staferla, OpenAlex) e OCR
    - ./catalog:/app/catalog                  # curadoria (overrides.csv) e catálogo gerado
    - ./config:/app/config:ro                 # léxico/escopo editáveis sem rebuild
    - hf_cache:/cache/huggingface             # modelos de embedding baixados
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    environment: *db-env
    command: >
      postgres -c shared_buffers=1GB -c maintenance_work_mem=1GB -c work_mem=64MB
               -c max_parallel_maintenance_workers=4 -c effective_cache_size=3GB
    shm_size: 1g
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # API REST (/docs) + servidor MCP (/mcp) para o Claude
  app:
    <<: *app
    command: uvicorn psilib.api:app --host 0.0.0.0 --port 8010
    ports:
      - "127.0.0.1:8010:8010"
    # Readiness: banco acessível e modelo de embeddings carregado (/health é só liveness).
    # start_period cobre o carregamento do modelo (~2 GB; na primeira vez, também o download).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/ready')"]
      start_period: 300s
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Execuções do pipeline: docker compose run --rm pipeline <etapa>
  pipeline:
    <<: *app
    entrypoint: ["psilib"]
    command: ["--help"]
    profiles: ["pipeline"]

  # Testes dentro da imagem (mesmo ambiente da produção): make test-docker
  # Os de integração usam o banco psilib_test, criado e apagado pelos próprios testes.
  test:
    <<: *app
    build:
      context: .
      target: test
    image: psilib-test:latest
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-psi}:${POSTGRES_PASSWORD:-psi}@db:5432/${POSTGRES_DB:-psilib}
      EMBEDDING_WARMUP: "false"
    volumes: []
    profiles: ["test"]

  lab:
    <<: *app
    build:
      context: .
      target: lab
    image: psilib-lab:latest
    volumes:
      - ./notebooks:/app/notebooks
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - hf_cache:/cache/huggingface
    ports:
      - "127.0.0.1:8888:8888"
    profiles: ["lab"]

volumes:
  pgdata:
  hf_cache:
