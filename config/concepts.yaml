# Léxico multilíngue de conceitos (pt, es, fr, en, de).
#
# Os padrões são regex aplicadas ao texto normalizado: minúsculas, sem acentos,
# apóstrofos tipográficos convertidos para '. Com `cs: true` o padrão é aplicado
# ao texto sem acentos mas com maiúsculas preservadas (ex.: "Outro" vs "outro").
# Cada chunk só é comparado com os padrões da sua língua (+ `any`), o que evita que
# "real" em inglês conte como o registro do Real em português.
#
# O léxico é deliberadamente conservador: prefere perder ocorrências a contar ruído.
# Edite aqui, rode `psilib concepts` e as visões de linha do tempo são recalculadas.

concepts:
  # ------------------------------------------------------------ registros
  - slug: real
    label: Real
    family: registros
    terms:
      pt: ["\\b(?:o|do|no|ao|pelo) real\\b"]
      es: ["\\b(?:lo|del|al) real\\b"]
      fr: ["\\b(?:le|du|au) reel\\b"]
      en: ["\\bthe real\\b"]
  - slug: simbolico
    label: Simbólico
