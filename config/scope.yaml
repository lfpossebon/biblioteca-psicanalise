  - {name: "Luiz Alfredo Garcia-Roza", line: comentador_freudiano, pattern: "garcia roza"}
  - {name: "Renato Mezan",        line: comentador_freudiano, pattern: "mezan"}
  - {name: "Joel Birman",         line: comentador_freudiano, pattern: "birman"}
  - {name: "Jurandir Freire Costa", line: comentador_freudiano, pattern: "jurandir freire"}
  - {name: "Alfredo Naffah Neto", line: comentador_freudiano, pattern: "naffah"}
  - {name: "Luis Hornstein",      line: comentador_freudiano, pattern: "hornstein"}
  - {name: "Hélio Pellegrino",    line: comentador_freudiano, pattern: "pell?egrino"}
