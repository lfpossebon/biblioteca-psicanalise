# Escopo do acervo: o que entra e o que fica de fora.
#
# Regra: entram Freud, Lacan, comentadores freudianos/lacanianos e escolas pós-lacanianas
# (incluindo a escola argentina). Linhas não convergentes (Klein, Winnicott, Bion, Ferenczi,
# psicologia do ego...) ficam fora. Tudo é classificado mesmo quando excluído, para que
# a decisão seja auditável e reversível (ver catalog/overrides.csv).
#
# Padrões são expressões regulares aplicadas ao caminho do arquivo normalizado
# (minúsculas, sem acentos). A primeira regra que casar vence: autores antes de pastas.

lines:
  freud:               {in_scope: true,  label: "Freud (fonte primária)"}
  lacan:               {in_scope: true,  label: "Lacan (fonte primária)"}
  lacaniano:           {in_scope: true,  label: "Comentadores e escolas lacanianas"}
  escola_argentina:    {in_scope: true,  label: "Escola argentina (Eidelsztein, Schejtman...)"}
  comentador_freudiano: {in_scope: true, label: "Comentadores de Freud"}
  fonte_clinica:       {in_scope: true,  label: "Fontes clínicas comentadas por Freud/Lacan (Schreber...)"}
  referencia:          {in_scope: true,  label: "Dicionários e vocabulários"}
  epistemologia:       {in_scope: false, label: "Epistemologia e filosofia de apoio (Lakatos, Koyré, Kojève)"}
  kleiniano:           {in_scope: false, label: "Escola kleiniana"}
  winnicottiano:       {in_scope: false, label: "Winnicott e independentes"}
  ferencziano:         {in_scope: false, label: "Ferenczi e herdeiros"}
  outras_psicanalises: {in_scope: false, label: "Outras linhas (ego, reichiana, eclética)"}
  fora_do_tema:        {in_scope: false, label: "Fora do tema (pessoal, outras áreas)"}
  autoral:             {in_scope: false, label: "Trabalhos do próprio usuário"}
  revisar:             {in_scope: false, label: "Não classificado — revisar"}

# Extensões de documentos de texto (mídia fica para a fase de transcrição).
document_extensions: [pdf, docx, doc, epub, txt, html, htm]

# Pastas/arquivos do corpus ignorados por completo.
ignore:
  - "^biblioteca[ -]psicanalise/"
  - "/\\.ds_store$"
  - "~\\$"

authors:
