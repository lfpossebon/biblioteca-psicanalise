  - {name: "Fabián Schejtman",    line: escola_argentina, pattern: "schejtman"}
  - {name: "Roberto Mazzuca",     line: escola_argentina, pattern: "mazzuca"}
  - {name: "Bruno Bonoris",       line: escola_argentina, pattern: "bonoris"}
  - {name: "Pablo Amster",        line: escola_argentina, pattern: "amster"}
