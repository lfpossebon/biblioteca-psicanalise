  - {name: "Félix Morales Montiel", line: escola_argentina, pattern: "morales montiel"}
  - {name: "Diana Rabinovich",    line: escola_argentina, pattern: "rabinovich"}
  - {name: "Roberto Harari",      line: escola_argentina, pattern: "harari"}
  - {name: "Revista Borda (Apertura)", line: escola_argentina, pattern: "revista borda"}
  - {name: "Henry Krutzen",       line: referencia, pattern: "krutzen"}
  # --- lacanianos
