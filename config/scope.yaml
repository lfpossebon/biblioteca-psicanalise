  - {name: "Otto Fenichel",       line: outras_psicanalises, pattern: "fenichel"}
  - {name: "Joyce McDougall",     line: outras_psicanalises, pattern: "mcdougall"}
  - {name: "Christopher Bollas",  line: outras_psicanalises, pattern: "bollas"}
  - {name: "Heinrich Racker",     line: kleiniano, pattern: "racker"}
  - {name: "Esther Bick",         line: kleiniano, pattern: "\\bbick\\b"}
  - {name: "Susan Isaacs",        line: kleiniano, pattern: "isaacs"}
  - {name: "Claude Geets",        line: kleiniano, pattern: "geets|esquizo ?paranoide"}
  - {name: "René Spitz",          line: outras_psicanalises, pattern: "spitz"}
  - {name: "Alexander Lowen",     line: outras_psicanalises, pattern: "lowen"}
  - {name: "Daniel Lagache",      line: outras_psicanalises, pattern: "lagache"}
  - {name: "Imre Lakatos",        line: epistemologia, pattern: "lakatos"}
  - {name: "Alexandre Koyré",     line: epistemologia, pattern: "koyre"}
  - {name: "Alan Chalmers",       line: epistemologia, pattern: "chalmers"}
  - {name: "Alexandre Kojève",    line: epistemologia, pattern: "kojeve"}
  - {name: "Cezar Mortari",       line: epistemologia, pattern: "mortari"}
  - {name: "Kasner & Newman",     line: epistemologia, pattern: "kasner"}
  - {name: "Fora do tema",        line: fora_do_tema, pattern: "contrato de locacao|piscina|gramatica|superinteressante|preciado|butler|illouz|rolnik|foucault|marx   sobre|dodds|botega|suicid|hifen|alienacao parental|borderline|familia em desordem|envelhecimento"}
  - {name: "Luiz Felipe Possebon", line: autoral, pattern: "possebon"}
  # --- fontes primárias (padrões específicos; vêm depois dos comentadores para que
  #     "Eidelsztein - El seminario 20 de Jacques Lacan" seja atribuído ao comentador)
  - {name: "Jacques Lacan", line: lacan, pattern: "\\blacan\\b[ ,.-]+(j\\.|jacques)?.*(seminario|seminaire|escritos|ecrits|televis|terceira|troisieme|paredes|mito individual|meu ensino|triunfo|conferencias|outros (arquivos|escritos)|north armorica|intromistura)|jacques lacan (o seminario|estou)|escritos jacques lacan|jacques lacan   o seminario|lacan gilleslapouge|discurso de toquio|^livros/seminarios lacan/"}
  - {name: "Sigmund Freud", line: freud, pattern: "freud ?s\\.|s\\. freud|sigmund[ -]freud|freud sigmund|\\bfreud\\b.*(obras? completas?|cia das letras|companhia das letras|neurose, psicose)|^livros/freud vol|vol[ ._-]*(09|11)\\b.*(ratos|totem)|teoria da sexualidade"}
  - {name: "Daniel Paul Schreber", line: fonte_clinica, pattern: "schreber|memoria de um doente dos nervos"}
  # --- menção genérica: comentador ainda não identificado (nunca atribuir a Lacan/Freud por engano)
  - {name: "Comentador lacaniano (não identificado)", line: lacaniano, pattern: "\\blacan|lacaniano|lacaniana"}
  - {name: "Comentador freudiano (não identificado)", line: comentador_freudiano, pattern: "\\bfreud"}

# Regras por pasta (aplicadas só se nenhum autor casar).
folders:
  - {pattern: "^livros/seminarios lacan/",      author: "Jacques Lacan", line: lacan}
  - {pattern: "^livros/freud obras completas/", author: "Sigmund Freud", line: freud}
  - {pattern: "^lacan do zero/",                author: "Lacan do Zero (curso)", line: lacaniano}
  - {pattern: "^cep/",                          line: revisar}

# Sinal de conteúdo para documentos "revisar": termos que indicam cada linha.
content_signals:
  lacaniano: ["lacan", "significante", "signifiant", "gozo", "goce", "jouissance", "objeto a", "objet a", "nome-do-pai", "grande outro", "sujeito barrado", "sinthoma", "sinthome"]
  freud: ["freud", "recalque", "pulsao", "complexo de edipo", "inconsciente", "metapsicologia"]
  kleiniano: ["klein", "posicao esquizo-paranoide", "posicao depressiva", "inveja", "reparacao", "identificacao projetiva", "objeto parcial"]
  winnicottiano: ["winnicott", "objeto transicional", "holding", "mae suficientemente boa", "self verdadeiro"]
  ferencziano: ["ferenczi", "confusao de lingua", "introjecao", "tecnica ativa", "elasticidade"]
